<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Coffeehouse</title>
</head>
<body>
    <header>
        <nav aria-label="Main">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About us</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <img
            src="https://images.pexels.com/photos/997670/pexels-photo-997670.jpeg"
            alt="Coffee cup"
            width=100%
        >

        <p>Feel free to reach out to us with any questions or inquiries. We are always happy to hear from our customers and will respond as quickly as possible.</p>

        <form action="submit_form.php" method="post">
            <p>
                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                >
            </p>

            <p>
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >
            </p>

            <p>
                <label for="message">Message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="4"
                    required
                ></textarea>
            </p>

            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
