<!DOCTYPE html>

<html lang="en">
  
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Windows nostalgia</title>
  </head>
  
  <body>
    <section
      class="window"
      role="alertdialog"
      aria-labelledby="error-title"
      aria-describedby="error-message"
      >
    
      <header class="title-bar">
        <h1 id="error-title">Kernel panic</h1>
      </header>

      <div class="window-body">
        
        <div class="message">
          
          <img
            class="error-icon"
            src="https://i.postimg.cc/wTQJ3hgb/error.png"
            width="76"
            height="76"
            alt=""
          />

          <p id="error-message">
            Please shut down your computer, and go for a walk.
          </p>
        
        </div>

        <div class="actions">
          <button class="classic-button" type="button">Cancel</button>
        </div>
      
      </div>

    </section>
  
  </body>

</html>
